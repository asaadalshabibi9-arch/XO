<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Games Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0c0c0c;
  --bg2:#161616;
  --bg3:#1f1f1f;
  --border:#2a2a2a;
  --text:#f2ede8;
  --text2:#b0a89e;
  --text3:#5a5450;
  --x:#e07a5f;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --radius:16px;
}
.light{
  --bg:#f0ece6;
  --bg2:#fff;
  --bg3:#e8e2da;
  --border:#d4ccc4;
  --text:#1a1614;
  --text2:#6a6058;
  --text3:#aaa49e;
  --shadow:0 4px 24px rgba(0,0,0,.1);
}

html,body{height:100%;background:var(--bg);font-family:'Tajawal',sans-serif;}

.gw{
  width:100%;max-width:420px;margin:0 auto;
  padding:16px 16px max(16px, env(safe-area-inset-bottom));
  padding-top:max(16px, env(safe-area-inset-top));
  color:var(--text);background:var(--bg);
  min-height:100vh;display:flex;flex-direction:column;
  transition:background .3s,color .3s;
}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.top-title{font-size:22px;font-weight:800;letter-spacing:.05em;color:var(--text);}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:50px;padding:6px 14px;transition:background .25s,border-color .25s;
  user-select:none;}
.toggle-icon{font-size:14px;}
.toggle-track{width:36px;height:20px;border-radius:10px;background:var(--border);
  position:relative;transition:background .25s;flex-shrink:0;}
.light .toggle-track{background:#bbb;}
.toggle-thumb{position:absolute;top:3px;left:3px;width:14px;height:14px;
  border-radius:50%;background:var(--text3);transition:transform .25s,background .25s;}
.light .toggle-thumb{transform:translateX(16px);background:#fff;}

.menu-subtitle{font-size:14px;color:var(--text2);margin-bottom:24px;font-weight:500;}
.games-list{display:flex;flex-direction:column;gap:14px;flex:1;}
.game-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  text-decoration:none;transition:background .2s, border-color .2s, transform .15s;box-shadow:var(--shadow);}
.game-card:active{transform:scale(.98);background:var(--bg3);}
.game-info{display:flex;align-items:center;gap:16px;}
.game-icon{font-size:32px;}
.game-name{font-size:18px;font-weight:700;color:var(--text);margin-bottom:2px;}
.game-desc{font-size:12px;color:var(--text2);font-weight:500;}
.arrow-icon{font-size:18px;color:var(--text3);transition:transform .2s;}
.game-card:hover .arrow-icon{transform:translateX(-4px);color:var(--x);}

.game-card.disabled{cursor:default;opacity:0.6;background:var(--bg2);border-style:dashed;}
.game-card.disabled:active{transform:none;}
.badge{background:var(--bg3);color:var(--text2);font-size:11px;padding:4px 8px;border-radius:6px;font-weight:700;}
</style>
</head>
<body>
<div class="gw" id="app">

  <div class="topbar">
    <span class="top-title">Games Platform</span>
    <div class="toggle" onclick="toggleTheme()">
      <span id="te0">🌙</span>
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
      <span class="toggle-icon" id="tl0">Dark</span>
    </div>
  </div>
  
  <p class="menu-subtitle">Choose the game you want to play:</p>

  <div class="games-list">
    <a href="xo.html" class="game-card">
      <div class="game-info">
        <span class="game-icon">❌</span>
        <div>
          <h2 class="game-name">X O (Tic Tac Toe)</h2>
          <p class="game-desc">Play against the computer or a friend</p>
        </div>
      </div>
      <span class="arrow-icon">→</span>
    </a>

    <div class="game-card disabled">
      <div class="game-info">
        <span class="game-icon">🎮</span>
        <div>
          <h2 class="game-name">New Game</h2>
          <p class="game-desc">Coming soon in the next update</p>
        </div>
      </div>
      <span class="badge">Soon</span>
    </div>
  </div>

</div>

<script>
let isLight=false;
function toggleTheme(){
  isLight=!isLight;
  document.getElementById('app').classList.toggle('light',isLight);
  document.getElementById('te0').textContent=isLight?'☀️':'🌙';
  document.getElementById('tl0').textContent=isLight?'Light':'Dark';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title id="page-title">منصة الألعاب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0c0c0c;
  --bg2:#161616;
  --bg3:#1f1f1f;
  --border:#2a2a2a;
  --text:#f2ede8;
  --text2:#b0a89e;
  --text3:#5a5450;
  --x:#e07a5f;
  --o:#5b8ccc;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --radius:16px;
}
.light{
  --bg:#f0ece6;
  --bg2:#fff;
  --bg3:#e8e2da;
  --border:#d4ccc4;
  --text:#1a1614;
  --text2:#6a6058;
  --text3:#aaa49e;
  --x:#c4593c;
  --o:#2e69b0;
  --shadow:0 4px 24px rgba(0,0,0,.1);
}

html,body{height:100%;background:var(--bg);font-family:'Tajawal',sans-serif;}

.gw{
  width:100%;max-width:440px;margin:0 auto;
  padding:16px 16px max(16px, env(safe-area-inset-bottom));
  padding-top:max(16px, env(safe-area-inset-top));
  color:var(--text);background:var(--bg);
  min-height:100vh;display:flex;flex-direction:column;
  transition:background .25s,color .25s;
}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.top-title{font-size:22px;font-weight:800;letter-spacing:.05em;color:var(--text);}
.actions-wrap{display:flex;align-items:center;gap:8px;}

.action-btn{display:flex;align-items:center;gap:6px;cursor:pointer;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:50px;padding:6px 12px;transition:background .25s,border-color .25s;
  user-select:none;font-size:12px;font-weight:700;color:var(--text2);}

.toggle-track{width:32px;height:18px;border-radius:10px;background:var(--border);
  position:relative;transition:background .25s;flex-shrink:0;}
.light .toggle-track{background:#bbb;}
.toggle-thumb{position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:var(--text3);transition:transform .25s,background .25s;}
.light .toggle-thumb{transform:translateX(14px);background:#fff;}

.menu-subtitle{font-size:14px;color:var(--text2);margin-bottom:20px;font-weight:500;}

.games-list{display:flex;flex-direction:column;gap:12px;flex:1;}

.game-card{display:flex;align-items:center;justify-content:space-between;
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;text-decoration:none;color:var(--text);transition:all .2s ease;
  box-shadow:var(--shadow);cursor:pointer;}
.game-card:not(.disabled):active{transform:scale(.98);background:var(--bg3);}

/* تصميم الكرت المعطل / القادم قريباً */
.game-card.disabled{opacity:0.6;cursor:default;border-style:dashed;}

.game-info{display:flex;align-items:center;gap:14px;}
.game-icon{font-size:32px;display:flex;align-items:center;justify-content:center;
  background:var(--bg3);width:54px;height:54px;border-radius:12px;border:1px solid var(--border);}

.game-name{font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px;}
.game-desc{font-size:12px;color:var(--text2);font-weight:500;}

.arrow-icon{font-size:18px;color:var(--text3);font-weight:700;transition:color .2s;}
.game-card:not(.disabled):hover .arrow-icon{color:var(--x);}

.badge{background:var(--bg3);color:var(--text2);font-size:11px;padding:4px 8px;border-radius:6px;font-weight:700;border:1px solid var(--border);}
</style>
</head>
<body>
<div class="gw" id="app">

  <div class="topbar">
    <span class="top-title" id="t-main-title">منصة الألعاب</span>
    <div class="actions-wrap">
      <div class="action-btn" onclick="toggleLang()" id="lang-btn">EN</div>
      <div class="action-btn" onclick="toggleTheme()">
        <span id="te0">🌙</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
      </div>
    </div>
  </div>

  <p class="menu-subtitle" id="t-subtitle">اختر اللعبة التي تريد الاستمتاع بها:</p>

  <div class="games-list">
    
    <a href="xo.html" class="game-card">
      <div class="game-info">
        <span class="game-icon">❌</span>
        <div>
          <h2 class="game-name" id="t-g1-title">إكس أو (Tic Tac Toe)</h2>
          <p class="game-desc" id="t-g1-desc">العب ضد صديقك أو ضد الذكاء الاصطناعي</p>
        </div>
      </div>
      <span class="arrow-icon">→</span>
    </a>

    <a href="mafia.html" class="game-card">
      <div class="game-info">
        <span class="game-icon">🕵️‍♂️</span>
        <div>
          <h2 class="game-name" id="t-g2-title">المافيا (Mafia)</h2>
          <p class="game-desc" id="t-g2-desc">لعبة الذكاء والاستنتاج الجماعية</p>
        </div>
      </div>
      <span class="arrow-icon">→</span>
    </a>

    <div class="game-card disabled">
      <div class="game-info">
        <span class="game-icon">🎮</span>
        <div>
          <h2 class="game-name" id="t-g3-title">لعبة جديدة</h2>
          <p class="game-desc" id="t-g3-desc">قادمة قريباً في التحديث القادم</p>
        </div>
      </div>
      <span class="badge" id="t-g3-badge">قريباً</span>
    </div>

  </div>

</div>

<script>
let lang = localStorage.getItem('lang') || 'ar';
let isLight = false;

const translations = {
  ar: {
    mainTitle: "منصة الألعاب",
    subtitle: "اختر اللعبة التي تريد الاستمتاع بها:",
    g1Title: "إكس أو (Tic Tac Toe)",
    g1Desc: "العب ضد صديقك أو ضد الذكاء الاصطناعي",
    g2Title: "المافيا (Mafia)",
    g2Desc: "لعبة الذكاء والاستنتاج الجماعية",
    g3Title: "لعبة جديدة",
    g3Desc: "قادمة قريباً في التحديث القادم",
    g3Badge: "قريباً",
    langBtn: "EN"
  },
  en: {
    mainTitle: "Games Platform",
    subtitle: "Choose the game you want to play:",
    g1Title: "X O (Tic Tac Toe)",
    g1Desc: "Play against a friend or the AI",
    g2Title: "Mafia Game",
    g2Desc: "Social deduction and intelligence game",
    g3Title: "New Game",
    g3Desc: "Coming soon in the next update",
    g3Badge: "Soon",
    langBtn: "AR"
  }
};

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  localStorage.setItem('lang', lang);

  document.getElementById('page-title').textContent = translations[lang].mainTitle;
  document.getElementById('t-main-title').textContent = translations[lang].mainTitle;
  document.getElementById('t-subtitle').textContent = translations[lang].subtitle;
  document.getElementById('t-g1-title').textContent = translations[lang].g1Title;
  document.getElementById('t-g1-desc').textContent = translations[lang].g1Desc;
  document.getElementById('t-g2-title').textContent = translations[lang].g2Title;
  document.getElementById('t-g2-desc').textContent = translations[lang].g2Desc;
  document.getElementById('t-g3-title').textContent = translations[lang].g3Title;
  document.getElementById('t-g3-desc').textContent = translations[lang].g3Desc;
  document.getElementById('t-g3-badge').textContent = translations[lang].g3Badge;
  document.getElementById('lang-btn').textContent = translations[lang].langBtn;
}

function toggleLang() {
  lang = lang === 'ar' ? 'en' : 'ar';
  applyLang();
}

function toggleTheme() {
  isLight = !isLight;
  document.getElementById('app').classList.toggle('light', isLight);
  document.getElementById('te0').textContent = isLight ? '☀️' : '🌙';
}

// تطبيق الإعدادات عند التحميل
applyLang();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>X O Game</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0c0c0c;
  --bg2:#161616;
  --bg3:#1f1f1f;
  --border:#2a2a2a;
  --border2:#222;
  --text:#f2ede8;
  --text2:#b0a89e;
  --text3:#5a5450;
  --x:#e07a5f;
  --o:#5b8ccc;
  --x-bg:rgba(224,122,95,.08);
  --o-bg:rgba(91,140,204,.08);
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --radius:16px;
}
.light{
  --bg:#f0ece6;
  --bg2:#fff;
  --bg3:#e8e2da;
  --border:#d4ccc4;
  --border2:#ddd;
  --text:#1a1614;
  --text2:#6a6058;
  --text3:#aaa49e;
  --x:#c4593c;
  --o:#2e69b0;
  --x-bg:rgba(196,89,60,.07);
  --o-bg:rgba(46,105,176,.07);
  --shadow:0 4px 24px rgba(0,0,0,.1);
}

html,body{height:100%;background:var(--bg);font-family:'Tajawal',sans-serif;}

.gw{
  width:100%;max-width:420px;margin:0 auto;
  padding:16px 16px max(16px, env(safe-area-inset-bottom));
  padding-top:max(16px, env(safe-area-inset-top));
  color:var(--text);background:var(--bg);
  min-height:100vh;display:flex;flex-direction:column;
  transition:background .3s,color .3s;
}

.screen{display:none;flex-direction:column;flex:1;}
.screen.active{display:flex;}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.top-title{font-size:22px;font-weight:800;letter-spacing:.05em;color:var(--text);}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:50px;padding:6px 14px;transition:background .25s,border-color .25s;
  user-select:none;}
.toggle-icon{font-size:14px;}
.toggle-track{width:36px;height:20px;border-radius:10px;background:var(--border);
  position:relative;transition:background .25s;flex-shrink:0;}
.light .toggle-track{background:#bbb;}
.toggle-thumb{position:absolute;top:3px;left:3px;width:14px;height:14px;
  border-radius:50%;background:var(--text3);transition:transform .25s,background .25s;}
.light .toggle-thumb{transform:translateX(16px);background:#fff;}

.big-title{
  font-size:clamp(3rem,18vw,4.5rem);font-weight:800;text-align:center;
  letter-spacing:.18em;color:var(--text);margin:8px 0 28px;
  line-height:1;
}
.big-title span.tx{color:var(--x);}
.big-title span.to{color:var(--o);}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;margin-bottom:12px;transition:background .3s,border-color .3s;}
.lbl{font-size:12px;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:9px;display:block;font-weight:700;}
.inp{width:100%;background:var(--bg3);border:1.5px solid var(--border);
  border-radius:10px;color:var(--text);padding:13px 15px;font-size:16px;
  font-family:'Tajawal',sans-serif;transition:border-color .2s,background .3s;
  -webkit-appearance:none;appearance:none;}
.inp:focus{outline:none;border-color:var(--x);}
.inp::placeholder{color:var(--text3);}

.mode-row{display:flex;gap:10px;margin-top:10px;}
.mbtn{flex:1;padding:18px 8px;border:1.5px solid var(--border);border-radius:12px;
  background:var(--bg3);color:var(--text2);cursor:pointer;font-size:14px;
  font-family:'Tajawal',sans-serif;text-align:center;font-weight:700;
  line-height:1.5;transition:all .2s;touch-action:manipulation;}
.mbtn:active{transform:scale(.97);}
.mbtn.sel{border-color:var(--x);color:var(--x);background:var(--x-bg);}
.micon{font-size:22px;display:block;margin-bottom:6px;}

.go-btn{width:100%;padding:17px;background:var(--x);border:none;border-radius:12px;
  color:#fff;font-size:17px;font-weight:800;cursor:pointer;
  font-family:'Tajawal',sans-serif;margin-top:8px;letter-spacing:.03em;
  touch-action:manipulation;appearance:none;-webkit-appearance:none;
  transition:opacity .15s,transform .15s;box-shadow:0 4px 20px rgba(224,122,95,.35);}
.go-btn:active{opacity:.85;transform:scale(.98);}

.score-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.pcrd{flex:1;background:var(--bg2);border:2px solid var(--border2);
  border-radius:14px;padding:12px 8px;text-align:center;
  transition:border-color .25s,background .3s;}
.pcrd.ax{border-color:var(--x);background:var(--x-bg);}
.pcrd.ao{border-color:var(--o);background:var(--o-bg);}
.pname{font-size:11px;color:var(--text2);margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;letter-spacing:.04em;}
.pscore{font-size:clamp(26px,8vw,36px);font-weight:800;line-height:1;}
.cx{color:var(--x);}.co{color:var(--o);}
.vs-sep{color:var(--text3);font-size:13px;font-weight:700;flex-shrink:0;}

.st{text-align:center;font-size:15px;color:var(--text2);
  margin-bottom:14px;min-height:22px;font-weight:600;}
.st .sx{color:var(--x);font-weight:800;}
.st .so{color:var(--o);font-weight:800;}

.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;
  padding:4px 0 16px;}
.board{display:grid;grid-template-columns:repeat(3,1fr);
  gap:clamp(8px,2.5vw,12px);width:100%;max-width:360px;}
.cell{aspect-ratio:1;background:var(--bg2);border:1.5px solid var(--border2);
  border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .15s,transform .1s;
  touch-action:manipulation;box-shadow:var(--shadow);}
.cell:active:not(.taken){transform:scale(.94);background:var(--bg3);}
.cell.taken{cursor:default;}
.cell svg{width:52%;height:52%;opacity:0;transform:scale(.5) rotate(-15deg);
  transition:opacity .2s cubic-bezier(.34,1.56,.64,1),
             transform .2s cubic-bezier(.34,1.56,.64,1);}
.cell.show svg{opacity:1;transform:scale(1) rotate(0);}
.cell.win-cell{background:var(--bg3);}
.cell.win-cell.xw{border-color:var(--x);}
.cell.win-cell.ow{border-color:var(--o);}

.btn-row{display:flex;gap:8px;justify-content:center;}
.gbtn{padding:12px 24px;border:1.5px solid var(--border);border-radius:10px;
  background:transparent;color:var(--text2);cursor:pointer;font-size:14px;
  font-family:'Tajawal',sans-serif;font-weight:700;touch-action:manipulation;
  transition:background .15s,color .15s;}
.gbtn:active{background:var(--bg3);color:var(--text);}

.win-body{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;position:relative;overflow:hidden;
  padding:1.5rem 1rem;}
.win-emoji{font-size:clamp(3rem,15vw,5rem);margin-bottom:16px;
  animation:wbounce .5s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes wbounce{0%{transform:scale(0) rotate(-20deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
.win-name{font-size:clamp(1.8rem,8vw,2.8rem);font-weight:800;margin-bottom:6px;
  animation:wfade .4s .15s ease both;}
@keyframes wfade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.win-sub{font-size:14px;color:var(--text2);margin-bottom:32px;font-weight:600;
  animation:wfade .4s .25s ease both;}
.win-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  animation:wfade .4s .35s ease both;}
.wa{padding:14px 28px;border-radius:12px;cursor:pointer;font-size:15px;
  font-family:'Tajawal',sans-serif;border:1.5px solid var(--border);
  background:transparent;color:var(--text2);font-weight:700;touch-action:manipulation;}
.wa:active{background:var(--bg3);}
.wa.pr{background:var(--x);color:#fff;border-color:var(--x);
  box-shadow:0 4px 20px rgba(224,122,95,.35);}
.wa.pr:active{opacity:.85;}

.cf{position:absolute;width:8px;height:8px;border-radius:2px;
  opacity:0;pointer-events:none;}
@keyframes cfall{0%{opacity:1;transform:translateY(0) rotate(0);}
  100%{opacity:0;transform:translateY(320px) rotate(540deg);}}

.back-link{
  display:block;text-align:center;color:var(--text2);text-decoration:none;
  font-size:14px;font-weight:700;margin-top:16px;transition:color .2s;
}
.back-link:active{color:var(--x);}
</style>
</head>
<body>
<div class="gw" id="app">

  <div class="screen active" id="ws">
    <div class="topbar">
      <span class="top-title">X O</span>
      <div class="toggle" onclick="toggleTheme()">
        <span id="te1">🌙</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
        <span class="toggle-icon" id="tl1">Dark</span>
      </div>
    </div>

    <div class="big-title">
      <span class="tx">X</span>&thinsp;<span class="to">O</span>
    </div>

    <div class="card">
      <label class="lbl">Your name</label>
      <input class="inp" id="p1name" placeholder="Enter your name..." maxlength="14" inputmode="text"/>
    </div>

    <div class="card">
      <label class="lbl">Play mode</label>
      <div class="mode-row">
        <button class="mbtn sel" onclick="setMode('ai')" id="m-ai">
          <span class="micon">🤖</span>vs Computer
        </button>
        <button class="mbtn" onclick="setMode('2p')" id="m-2p">
          <span class="micon">🤝</span>Two players
        </button>
      </div>
      <div id="p2wrap" style="display:none;margin-top:12px;">
        <label class="lbl">Second player name</label>
        <input class="inp" id="p2name" placeholder="Enter name..." maxlength="14" inputmode="text"/>
      </div>
    </div>

    <button class="go-btn" onclick="startGame()">Start game →</button>
    
    <a href="index.html" class="back-link">Back to main menu</a>
  </div>

  <div class="screen" id="gs">
    <div class="topbar">
      <span class="top-title">X O</span>
      <div class="toggle" onclick="toggleTheme()">
        <span id="te2">🌙</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
        <span class="toggle-icon" id="tl2">Dark</span>
      </div>
    </div>
    <div class="score-row">
      <div class="pcrd" id="cx-c">
        <div class="pname" id="pxn">You</div>
        <div class="pscore cx" id="sx">0</div>
      </div>
      <div class="vs-sep">VS</div>
      <div class="pcrd" id="co-c">
        <div class="pname" id="pon">Computer</div>
        <div class="pscore co" id="so">0</div>
      </div>
    </div>
    <div class="st" id="st"></div>
    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
    <div class="btn-row">
      <button class="gbtn" onclick="resetRound()">New round</button>
      <button class="gbtn" onclick="goHome()">Game settings</button>
    </div>
    <a href="index.html" class="back-link">Back to main menu</a>
  </div>

  <div class="screen" id="win-s">
    <div class="topbar">
      <span class="top-title">X O</span>
      <div class="toggle" onclick="toggleTheme()">
        <span id="te3">🌙</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
        <span class="toggle-icon" id="tl3">Dark</span>
      </div>
    </div>
    <div class="win-body" id="win-inner">
      <span class="win-emoji" id="wemoji">🏆</span>
      <div class="win-name" id="wname"></div>
      <div class="win-sub" id="wsub"></div>
      <div class="win-acts">
        <button class="wa pr" onclick="resetRoundFromWin()">New round</button>
        <button class="wa" onclick="goHome()">Game settings</button>
      </div>
      <a href="index.html" class="back-link" style="margin-top:24px;">Back to main menu</a>
    </div>
  </div>

</div>

<script>
const WINS=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board=Array(9).fill(null),cur='X',over=false,mode='ai';
let scores={X:0,O:0},p1='You',p2='Computer',isLight=false;
let ctx;

function toggleTheme(){
  isLight=!isLight;
  document.getElementById('app').classList.toggle('light',isLight);
  const e=isLight?'☀️':'🌙',l=isLight?'Light':'Dark';
  for(let i=1;i<=3;i++){
    const el=document.getElementById('te'+i),ll=document.getElementById('tl'+i);
    if(el)el.textContent=e;if(ll)ll.textContent=l;
  }
}

function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();return ctx;}
function beep(freq,dur,type='sine'){
  try{const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.connect(g);g.connect(a.destination);
  o.frequency.setValueAtTime(freq,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq*.5,a.currentTime+dur);
  g.gain.setValueAtTime(.22,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  o.start();o.stop(a.currentTime+dur);}catch(e){}
}
function playClick(){beep(400,.07);}
function playWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*120));}
function playDraw(){beep(200,.5,'triangle');}

function setMode(m){
  mode=m;
  document.getElementById('m-ai').className='mbtn'+(m==='ai'?' sel':'');
  document.getElementById('m-2p').className='mbtn'+(m==='2p'?' sel':'');
  document.getElementById('p2wrap').style.display=m==='2p'?'block':'none';
}

function show(id){
  ['ws','gs','win-s'].forEach(s=>
    document.getElementById(s).className='screen'+(s===id?' active':''));
}

function startGame(){
  p1=document.getElementById('p1name').value.trim()||'Player X';
  p2=mode==='ai'?'Computer':(document.getElementById('p2name').value.trim()||'Player O');
  document.getElementById('pxn').textContent=p1;
  document.getElementById('pon').textContent=p2;
  scores={X:0,O:0};
  document.getElementById('sx').textContent='0';
  document.getElementById('so').textContent='0';
  resetRound(true);show('gs');
}

function svgX(){return`<svg viewBox="0 0 40 40" fill="none">
<path d="M8,8 C11,14 25,26 32,32" stroke="var(--x)" stroke-width="3.8" stroke-linecap="round"/>
<path d="M32,8 C28,14 14,25 8,32" stroke="var(--x)" stroke-width="3.8" stroke-linecap="round"/>
</svg>`;}
function svgO(){return`<svg viewBox="0 0 40 40" fill="none">
<path d="M20,6 C29.5,6 34,12 34,20 C34,28.5 28,35 20,35 C11.5,35 6,28.5 6,20 C6,12 11.5,6 20,6 Z"
  stroke="var(--o)" stroke-width="3.8" stroke-linecap="round" fill="none"/>
</svg>`;}

function renderBoard(){
  const el=document.getElementById('board');el.innerHTML='';
  for(let i=0;i<9;i++){
    const c=document.createElement('div');
    c.className='cell'+(board[i]?' taken show':'');
    if(board[i])c.innerHTML=board[i]==='X'?svgX():svgO();
    c.onclick=()=>play(i);el.appendChild(c);
  }updateStatus();
}

function updateStatus(){
  const cx=document.getElementById('cx-c'),co=document.getElementById('co-c');
  cx.className='pcrd'+(cur==='X'&&!over?' ax':'');
  co.className='pcrd'+(cur==='O'&&!over?' ao':'');
  if(!over){
    const name=cur==='X'?p1:p2,cls=cur==='X'?'sx':'so';
    document.getElementById('st').innerHTML=`Turn <span class="${cls}">${name}</span>`;
  }
}

function checkWin(b){
  for(const[a,c,d]of WINS)if(b[a]&&b[a]===b[c]&&b[a]===b[d])return{w:b[a],cells:[a,c,d]};
  return null;
}

function play(i){
  if(board[i]||over)return;
  board[i]=cur;playClick();
  const cells=document.querySelectorAll('.cell');
  cells[i].classList.add('show');
  cells[i].innerHTML=cur==='X'?svgX():svgO();
  const res=checkWin(board);
  if(res){
    over=true;scores[res.w]++;
    document.getElementById(res.w==='X'?'sx':'so').textContent=scores[res.w];
    res.cells.forEach(j=>{cells[j].classList.add('win-cell',res.w==='X'?'xw':'ow');});
    updateStatus();playWin();
    setTimeout(()=>showWin(res.w),650);
  }else if(!board.includes(null)){
    over=true;updateStatus();playDraw();setTimeout(showDraw,500);
  }else{
    cur=cur==='X'?'O':'X';updateStatus();
    if(mode==='ai'&&cur==='O')setTimeout(aiMove,420);
  }
}

function minimax(b,d,isMax){
  const r=checkWin(b);
  if(r)return r.w==='O'?10-d:d-10;
  if(!b.includes(null))return 0;
  if(isMax){let best=-Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]='O';best=Math.max(best,minimax(b,d+1,false));b[i]=null;}return best;}
  else{let best=Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]='X';best=Math.min(best,minimax(b,d+1,true));b[i]=null;}return best;}
}
function getBest(b){let bv=-Infinity,bm=-1;for(let i=0;i<9;i++)if(!b[i]){b[i]='O';const v=minimax(b,0,false);b[i]=null;if(v>bv){bv=v;bm=i;}}return bm;}
function aiMove(){if(over)return;const mv=getBest([...board]);if(mv!==-1)play(mv);}

function showWin(w){
  const name=w==='X'?p1:p2;
  document.getElementById('wemoji').textContent=w==='X'?'🎉':'🤖';
  document.getElementById('wname').textContent=`${name} wins!`;
  document.getElementById('wname').className='win-name '+(w==='X'?'cx':'co');
  document.getElementById('wsub').textContent=`X: ${scores.X}  ·  O: ${scores.O}`;
  spawnConfetti();
  show('win-s');
}
function showDraw(){
  document.getElementById('wemoji').textContent='🤝';
  document.getElementById('wname').textContent='Draw!';
  document.getElementById('wname').className='win-name';
  document.getElementById('wsub').textContent=`X: ${scores.X}  ·  O: ${scores.O}`;
  show('win-s');
}

function spawnConfetti(){
  const wrap=document.getElementById('win-inner');
  const colors=['#e07a5f','#5b8ccc','#f2ede8','#f4c95d','#7bc99a','#c48de0'];
  for(let i=0;i<28;i++){
    const d=document.createElement('div');d.className='cf';
    d.style.cssText=`left:${Math.random()*100}%;top:0px;background:${colors[i%colors.length]};
    animation:cfall ${.8+Math.random()*.9}s ${Math.random()*.5}s ease forwards;`;
    wrap.appendChild(d);setTimeout(()=>d.remove(),2000);
  }
}

function resetRound(init=false){
  board=Array(9).fill(null);cur='X';over=false;
  if(!init){show('gs');renderBoard();}else renderBoard();
}
function resetRoundFromWin(){resetRound();show('gs');}
function goHome(){resetRound();show('ws');}

renderBoard();
</script>
</body>
</html>

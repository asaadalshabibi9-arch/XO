<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title id="page-title">لعبة من أنا؟</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0c0c0c;
  --bg2:#161616;
  --bg3:#1f1f1f;
  --border:#2a2a2a;
  --text:#f2ede8;
  --text2:#b0a89e;
  --text3:#5a5450;
  --x:#e07a5f;
  --o:#5b8ccc;
  --green:#7bc99a;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --radius:16px;
}
.light{
  --bg:#f0ece6;
  --bg2:#fff;
  --bg3:#e8e2da;
  --border:#d4ccc4;
  --text:#1a1614;
  --text2:#6a6058;
  --text3:#aaa49e;
  --x:#c4593c;
  --o:#2e69b0;
  --green:#4a9c6d;
  --shadow:0 4px 24px rgba(0,0,0,.1);
}

html,body{height:100%;background:var(--bg);font-family:'Tajawal',sans-serif;}

.gw{
  width:100%;max-width:420px;margin:0 auto;
  padding:16px 16px max(16px, env(safe-area-inset-bottom));
  padding-top:max(16px, env(safe-area-inset-top));
  color:var(--text);background:var(--bg);
  min-height:100vh;display:flex;flex-direction:column;
  transition:background .3s,color .3s;
}

.screen{display:none;flex-direction:column;flex:1;}
.screen.active{display:flex;}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.top-title{font-size:20px;font-weight:800;letter-spacing:.05em;color:var(--text);}
.actions-wrap{display:flex;align-items:center;gap:8px;}

.action-btn{display:flex;align-items:center;gap:6px;cursor:pointer;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:50px;padding:6px 12px;transition:background .25s,border-color .25s;
  user-select:none;font-size:12px;font-weight:700;color:var(--text2);}

.toggle-track{width:32px;height:18px;border-radius:10px;background:var(--border);
  position:relative;transition:background .25s;flex-shrink:0;}
.light .toggle-track{background:#bbb;}
.toggle-thumb{position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:var(--text3);transition:transform .25s,background .25s;}
.light .toggle-thumb{transform:translateX(14px);background:#fff;}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;margin-bottom:12px;transition:background .3s,border-color .3s;box-shadow:var(--shadow);}
.lbl{font-size:12px;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:9px;display:block;font-weight:700;}

.go-btn{width:100%;padding:17px;background:var(--x);border:none;border-radius:12px;
  color:#fff;font-size:17px;font-weight:800;cursor:pointer;
  font-family:'Tajawal',sans-serif;margin-top:12px;letter-spacing:.03em;
  transition:opacity .15s,transform .15s;box-shadow:0 4px 20px rgba(224,122,95,.3);text-align:center;}
.go-btn:active{opacity:.85;transform:scale(.98);}

.category-grid {display:grid;grid-template-columns:repeat(2, 1fr);gap:10px;margin-bottom:8px;}
.cat-btn {background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:16px;
  font-size:14px;font-weight:700;color:var(--text);cursor:pointer;transition:all .2s;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px;}
.cat-btn.selected {background:rgba(224,122,95,.15);border-color:var(--x);color:var(--x);}
.cat-emoji {font-size:28px;}

.word-card {flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;text-align:center;margin-bottom:12px;box-shadow:var(--shadow);}
.current-word {font-size:42px;font-weight:800;color:var(--text);margin-bottom:14px;word-break:break-word;}
.timer-text {font-size:20px;font-weight:700;color:var(--x);background:var(--bg3);padding:6px 14px;border-radius:50px;border:1px solid var(--border);margin-bottom:24px;}

.action-row {display:flex;gap:12px;margin-top:auto;}
.game-action-btn {flex:1;padding:18px;border-radius:12px;font-size:16px;font-weight:800;
  cursor:pointer;font-family:'Tajawal',sans-serif;border:none;color:#fff;transition:all .15s;}
.game-action-btn:active {transform:scale(.97);}
.btn-correct {background:var(--green);box-shadow:0 4px 14px rgba(123,201,154,.3);}
.btn-pass {background:var(--o);box-shadow:0 4px 14px rgba(91,140,204,.3);}

.back-link{display:block;text-align:center;color:var(--text2);text-decoration:none;
  font-size:14px;font-weight:700;margin-top:18px;transition:color .2s;}
.back-link:active{color:var(--x);}
</style>
</head>
<body>
<div class="gw" id="app">

  <div class="screen active" id="start-screen">
    <div class="topbar">
      <span class="top-title" id="t-main-title">لعبة من أنا؟</span>
      <div class="actions-wrap">
        <div class="action-btn" onclick="toggleLang()" id="lang-btn">EN</div>
        <div class="action-btn" onclick="toggleTheme()">
          <span id="te0">🌙</span>
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </div>
      </div>
    </div>

    <div class="card" style="flex:1;justify-content:center;">
      <label class="lbl" id="t-select-cat">اختر تصنيف الكلمات:</label>
      <div class="category-grid" id="category-grid-ui">
        <div class="cat-btn selected" onclick="selectCategory('animals', this)">
          <span class="cat-emoji">🦁</span>
          <span id="t-cat-animals">حيوانات</span>
        </div>
        <div class="cat-btn" onclick="selectCategory('jobs', this)">
          <span class="cat-emoji">👨‍⚕️</span>
          <span id="t-cat-jobs">مهن وظائف</span>
        </div>
        <div class="cat-btn" onclick="selectCategory('places', this)">
          <span class="cat-emoji">🌍</span>
          <span id="t-cat-places">دول ومدن</span>
        </div>
        <div class="cat-btn" onclick="selectCategory('things', this)">
          <span class="cat-emoji">📦</span>
          <span id="t-cat-things">أدوات وأشياء</span>
        </div>
      </div>
      <p style="font-size:12px;color:var(--text2);text-align:center;margin-top:12px;line-height:1.5;" id="t-rules">
        طريقة اللعب: احمل الهاتف أمامك واجعل أصدقاءك يشرحون الكلمة لك دون قولها!
      </p>
    </div>

    <button class="go-btn" id="t-start-game-btn" onclick="startGame()">ابدأ اللعب الآن ←</button>
    <a href="index.html" class="back-link" id="t-back-home0">رجوع للقائمة الرئيسية</a>
  </div>

  <div class="screen" id="play-screen">
    <div class="topbar">
      <span class="top-title" id="t-play-title">خمن الكلمة</span>
      <span class="action-btn" id="live-score">النقاط: 0</span>
    </div>

    <div class="word-card">
      <span class="timer-text" id="timer-display">00:60</span>
      <h1 class="current-word" id="word-display">...</h1>
    </div>

    <div class="action-row">
      <button class="game-action-btn btn-pass" id="t-pass-btn" onclick="passWord()">تخطي (Pass)</button>
      <button class="game-action-btn btn-correct" id="t-correct-btn" onclick="correctWord()">صح (Correct)</button>
    </div>
  </div>

  <div class="screen" id="end-screen">
    <div class="topbar">
      <span class="top-title" id="t-end-title">النتيجة النهائية</span>
    </div>
    <div class="card" style="flex:1;justify-content:center;text-align:center;">
      <span style="font-size:74px;margin-bottom:16px;display:block;">⏱️</span>
      <h2 style="font-size:28px;font-weight:800;margin-bottom:12px;color:var(--x);" id="t-time-up">انتهى الوقت!</h2>
      <p style="font-size:18px;color:var(--text2);margin-bottom:8px;font-weight:500;" id="t-you-scored">لقد تمكنت من تخمين:</p>
      <span style="font-size:48px;font-weight:800;color:var(--text);" id="final-score">0</span>
      <p style="font-size:14px;color:var(--text2);margin-top:6px;" id="t-words">كلمات صحيحة</p>
    </div>
    <button class="go-btn" id="t-play-again-btn" onclick="restartGame()">لعب مرة أخرى</button>
    <a href="index.html" class="back-link" id="t-back-home1">رجوع للقائمة الرئيسية</a>
  </div>

</div>

<script>
let lang = localStorage.getItem('lang') || 'ar';
let isLight = false;
let selectedCategory = 'animals';
let currentWordIndex = 0;
let score = 0;
let timer = 60;
let timerInterval = null;
let activeWords = [];

const wordBank = {
  ar: {
    animals: ["أسد", "فيل", "زرافة", "نمر", "قرد", "غزال", "ثعلب", "حصان", "جمل", "بطة", "أرنب", "صقر", "دلفين", "حوت", "تمساح"],
    jobs: ["طبيب", "مهندس", "معلم", "شرطي", "رائد فضاء", "طيار", "محامي", "رسام", "طباخ", "مزارع", "نجار", "صحفي"],
    places: ["سلطنة عمان", "مكة المكرمة", "القاهرة", "طوكيو", "لندن", "باريس", "نيويورك", "دبي", "القدس", "روما"],
    things: ["هاتف", "قلم", "ساعة", "سيارة", "كتاب", "نظارة", "حاسوب", "مفتاح", "تلفاز", "كرسي", "حقيبة", "طاولة"]
  },
  en: {
    animals: ["Lion", "Elephant", "Giraffe", "Tiger", "Monkey", "Deer", "Fox", "Horse", "Camel", "Duck", "Rabbit", "Falcon", "Dolphin", "Whale", "Crocodile"],
    jobs: ["Doctor", "Engineer", "Teacher", "Policeman", "Astronaut", "Pilot", "Lawyer", "Painter", "Chef", "Farmer", "Carpenter", "Journalist"],
    places: ["Oman", "Mecca", "Cairo", "Tokyo", "London", "Paris", "New York", "Dubai", "Jerusalem", "Rome"],
    things: ["Phone", "Pen", "Watch", "Car", "Book", "Glasses", "Computer", "Key", "TV", "Chair", "Bag", "Table"]
  }
};

const translations = {
  ar: {
    mainTitle: "لعبة من أنا؟",
    selectCat: "اختر تصنيف الكلمات:",
    catAnimals: "حيوانات",
    catJobs: "مهن وظائف",
    catPlaces: "دول ومدن",
    catThings: "أدوات وأشياء",
    rules: "طريقة اللعب: احمل الهاتف أمامك واجعل أصدقاءك يشرحون الكلمة لك دون قولها!",
    startGame: "ابدأ اللعب الآن ←",
    backHome: "رجوع للقائمة الرئيسية",
    playTitle: "خمن الكلمة",
    scoreText: "النقاط: ",
    pass: "تخطي (Pass)",
    correct: "صح (Correct)",
    endTitle: "النتيجة النهائية",
    timeUp: "انتهى الوقت!",
    youScored: "لقد تمكنت من تخمين:",
    wordsText: "كلمات صحيحة",
    playAgain: "لعب مرة أخرى",
    langBtn: "EN"
  },
  en: {
    mainTitle: "Who Am I?",
    selectCat: "Choose word category:",
    catAnimals: "Animals",
    catJobs: "Jobs",
    catPlaces: "Places",
    catThings: "Things",
    rules: "How to play: Hold the phone up and let your friends describe the word without saying it!",
    startGame: "Start Game Now ←",
    backHome: "Back to Main Menu",
    playTitle: "Guess Word",
    scoreText: "Score: ",
    pass: "Pass",
    correct: "Correct",
    endTitle: "Final Result",
    timeUp: "Time is up!",
    youScored: "You have scored:",
    wordsText: "Correct words",
    playAgain: "Play Again",
    langBtn: "AR"
  }
};

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  localStorage.setItem('lang', lang);

  document.getElementById('page-title').textContent = translations[lang].mainTitle;
  document.getElementById('t-main-title').textContent = translations[lang].mainTitle;
  document.getElementById('t-select-cat').textContent = translations[lang].selectCat;
  document.getElementById('t-cat-animals').textContent = translations[lang].catAnimals;
  document.getElementById('t-cat-jobs').textContent = translations[lang].catJobs;
  document.getElementById('t-cat-places').textContent = translations[lang].catPlaces;
  document.getElementById('t-cat-things').textContent = translations[lang].catThings;
  document.getElementById('t-rules').textContent = translations[lang].rules;
  document.getElementById('t-start-game-btn').textContent = translations[lang].startGame;
  document.getElementById('t-back-home0').textContent = translations[lang].backHome;
  document.getElementById('t-back-home1').textContent = translations[lang].backHome;
  document.getElementById('t-play-title').textContent = translations[lang].playTitle;
  document.getElementById('t-pass-btn').textContent = translations[lang].pass;
  document.getElementById('t-correct-btn').textContent = translations[lang].correct;
  document.getElementById('t-end-title').textContent = translations[lang].endTitle;
  document.getElementById('t-time-up').textContent = translations[lang].timeUp;
  document.getElementById('t-you-scored').textContent = translations[lang].youScored;
  document.getElementById('t-words').textContent = translations[lang].wordsText;
  document.getElementById('t-play-again-btn').textContent = translations[lang].playAgain;
  document.getElementById('lang-btn').textContent = translations[lang].langBtn;
}

function toggleLang() {
  lang = lang === 'ar' ? 'en' : 'ar';
  applyLang();
}

function toggleTheme() {
  isLight = !isLight;
  document.getElementById('app').classList.toggle('light', isLight);
  document.getElementById('te0').textContent = isLight ? '☀️' : '🌙';
}

function show(id) {
  ['start-screen','play-screen','end-screen'].forEach(s =>
    document.getElementById(s).className = 'screen' + (s === id ? ' active' : ''));
}

function selectCategory(cat, el) {
  selectedCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

function startGame() {
  score = 0;
  timer = 60;
  document.getElementById('live-score').textContent = translations[lang].scoreText + score;
  
  // تجميع الكلمات وخلطها عشوائياً
  activeWords = [...wordBank[lang][selectedCategory]].sort(() => Math.random() - 0.5);
  currentWordIndex = 0;

  show('play-screen');
  displayWord();
  startTimer();
}

function displayWord() {
  if (currentWordIndex < activeWords.length) {
    document.getElementById('word-display').textContent = activeWords[currentWordIndex];
  } else {
    // إعادة خلط الكلمات إذا انتهت قبل انتهاء الوقت
    activeWords = [...wordBank[lang][selectedCategory]].sort(() => Math.random() - 0.5);
    currentWordIndex = 0;
    document.getElementById('word-display').textContent = activeWords[currentWordIndex];
  }
}

function startTimer() {
  document.getElementById('timer-display').textContent = `00:60`;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timer--;
    let seconds = timer < 10 ? '0' + timer : timer;
    document.getElementById('timer-display').textContent = `00:${seconds}`;

    if (timer <= 0) {
      endGame();
    }
  }, 1000);
}

function correctWord() {
  score++;
  document.getElementById('live-score').textContent = translations[lang].scoreText + score;
  currentWordIndex++;
  displayWord();
}

function passWord() {
  currentWordIndex++;
  displayWord();
}

function endGame() {
  clearInterval(timerInterval);
  show('end-screen');
  document.getElementById('final-score').textContent = score;
}

function restartGame() {
  show('start-screen');
}

applyLang();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title id="page-title">لعبة مزاد الكلمات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0c0c0c;
  --bg2:#161616;
  --bg3:#1f1f1f;
  --border:#2a2a2a;
  --text:#f2ede8;
  --text2:#b0a89e;
  --text3:#5a5450;
  --x:#e07a5f;
  --green:#7bc99a;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --radius:16px;
}
.light{
  --bg:#f0ece6;
  --bg2:#fff;
  --bg3:#e8e2da;
  --border:#d4ccc4;
  --text:#1a1614;
  --text2:#6a6058;
  --text3:#aaa49e;
  --green:#4a9c6d;
  --shadow:0 4px 24px rgba(0,0,0,.1);
}

html,body{height:100%;background:var(--bg);font-family:'Tajawal',sans-serif;}

.gw{
  width:100%;max-width:420px;margin:0 auto;
  padding:16px 16px max(16px, env(safe-area-inset-bottom));
  padding-top:max(16px, env(safe-area-inset-top));
  color:var(--text);background:var(--bg);
  min-height:100vh;display:flex;flex-direction:column;
  transition:background .3s,color .3s;
}

.screen{display:none;flex-direction:column;flex:1;}
.screen.active{display:flex;}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.top-title{font-size:20px;font-weight:800;letter-spacing:.05em;color:var(--text);}
.actions-wrap{display:flex;align-items:center;gap:8px;}

.action-btn{display:flex;align-items:center;gap:6px;cursor:pointer;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:50px;padding:6px 12px;transition:background .25s,border-color .25s;
  user-select:none;font-size:12px;font-weight:700;color:var(--text2);}

.toggle-track{width:32px;height:18px;border-radius:10px;background:var(--border);
  position:relative;transition:background .25s;flex-shrink:0;}
.light .toggle-track{background:#bbb;}
.toggle-thumb{position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:var(--text3);transition:transform .25s,background .25s;}
.light .toggle-thumb{transform:translateX(14px);background:#fff;}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;margin-bottom:12px;transition:background .3s,border-color .3s;box-shadow:var(--shadow);}
.lbl{font-size:12px;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:9px;display:block;font-weight:700;}

.inp{width:100%;background:var(--bg3);border:1.5px solid var(--border);
  border-radius:10px;color:var(--text);padding:13px 15px;font-size:16px;
  font-family:'Tajawal',sans-serif;transition:border-color .2s,background .3s;}
.inp:focus{outline:none;border-color:var(--x);}

.btn-row{display:flex;gap:8px;margin-top:8px;}
.sub-btn{flex:1;padding:12px;background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;color:var(--text2);font-weight:700;cursor:pointer;
  font-family:'Tajawal',sans-serif;font-size:14px;transition:all .2s;}
.sub-btn:active{transform:scale(.98);background:var(--border);}

.player-item{display:flex;align-items:center;justify-content:space-between;
  background:var(--bg3);padding:12px 14px;border-radius:10px;margin-bottom:8px;
  border:1px solid var(--border);font-weight:600;}
.remove-btn{color:var(--x);cursor:pointer;font-weight:800;font-size:16px;padding:0 4px;}

.go-btn{width:100%;padding:17px;background:var(--x);border:none;border-radius:12px;
  color:#fff;font-size:17px;font-weight:800;cursor:pointer;
  font-family:'Tajawal',sans-serif;margin-top:12px;letter-spacing:.03em;
  transition:opacity .15s,transform .15s;box-shadow:0 4px 20px rgba(224,122,95,.3);text-align:center;}
.go-btn:active{opacity:.85;transform:scale(.98);}

.category-box{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;text-align:center;margin-bottom:12px;box-shadow:var(--shadow);}
.current-cat{font-size:24px;font-weight:800;color:var(--text);margin-bottom:20px;line-height:1.4;}

.sec-display {font-size:64px;font-weight:800;color:var(--x);margin-bottom:12px;}

.action-row {display:flex;gap:12px;margin-top:auto;}
.game-action-btn {flex:1;padding:18px;border-radius:12px;font-size:16px;font-weight:800;
  cursor:pointer;font-family:'Tajawal',sans-serif;border:none;color:#fff;transition:all .15s;}
.game-action-btn:active {transform:scale(.97);}
.btn-correct {background:var(--green);box-shadow:0 4px 14px rgba(123,201,154,.3);}
.btn-fail {background:var(--bg3);color:var(--text);border:1px solid var(--border);}

.back-link{display:block;text-align:center;color:var(--text2);text-decoration:none;
  font-size:14px;font-weight:700;margin-top:18px;transition:color .2s;}
.back-link:active{color:var(--x);}

.score-item{display:flex;justify-content:space-between;align-items:center;padding:14px;
  background:var(--bg3);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;font-weight:700;}

.bid-input-container {display: flex; gap: 8px; width: 100%; margin-bottom: 12px; align-items: center;}
.bid-player-select {flex: 1; padding: 13px; background: var(--bg3); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; font-weight: 700; font-family: inherit; outline: none;}
.bid-num-input {width: 90px; text-align: center; font-weight: 800;}
</style>
</head>
<body>
<div class="gw" id="app">

  <div class="screen active" id="setup-screen">
    <div class="topbar">
      <span class="top-title" id="t-setup-title">مزاد الكلمات</span>
      <div class="actions-wrap">
        <div class="action-btn" onclick="toggleLang()" id="lang-btn">EN</div>
        <div class="action-btn" onclick="toggleTheme()">
          <span id="te0">🌙</span>
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </div>
      </div>
    </div>

    <div class="card">
      <label class="lbl" id="t-add-lbl">إدخال أسماء اللاعبين</label>
      <input class="inp" id="new-player-name" placeholder="اسم اللاعب..." maxlength="14"/>
      <div class="btn-row">
        <button class="sub-btn" id="t-add-btn" onclick="addPlayer()">إضافة</button>
      </div>
    </div>

    <div class="card" style="flex:1;">
      <label class="lbl" id="t-added-lbl">قائمة اللاعبين</label>
      <div id="players-list-ui"></div>
    </div>

    <button class="go-btn" id="t-start-game-btn" onclick="startGame()">ابدأ المزاد الآن ←</button>
    <a href="index.html" class="back-link" id="t-back-home0">رجوع للقائمة الرئيسية</a>
  </div>

  <div class="screen" id="play-screen">
    <div class="topbar">
      <span class="top-title" id="t-play-title">المزاد شغال!</span>
      <span class="action-btn" id="live-round">الجولة: 1/3</span>
    </div>

    <div class="category-box">
      <label class="lbl" id="t-cat-lbl">الفئة الحالية</label>
      <h1 class="current-cat" id="category-display">...</h1>
      <p style="font-size:13px;color:var(--text2);margin-bottom:16px;" id="t-bid-instruction">تزايدوا شفهياً، ثم أدخلوا اسم صاحب أعلى رقم للمزاد!</p>
      
      <div class="bid-input-container">
        <select class="bid-player-select" id="bid-winner-select"></select>
        <input class="inp bid-num-input" id="bid-amount-input" type="number" placeholder="0" min="1"/>
      </div>
      
      <div class="sec-display" id="sec-timer" style="display:none;">15</div>
    </div>

    <button class="go-btn" style="margin-bottom: 12px; background:var(--x);" id="t-start-bid-btn" onclick="startTimerAndChallenge()">ابدأ التحدي (15 ثانية) ⏱️</button>

    <div class="action-row" id="after-timer-actions" style="display: none;">
      <button class="game-action-btn btn-fail" id="t-fail-btn" onclick="playerActionResult(false)">فشل ❌</button>
      <button class="game-action-btn btn-correct" id="t-correct-btn" onclick="playerActionResult(true)">نجح ✅</button>
    </div>
  </div>

  <div class="screen" id="end-screen">
    <div class="topbar">
      <span class="top-title" id="t-end-title">الترتيب النهائي</span>
    </div>
    <div class="card" style="flex:1;">
      <div id="leaderboard-list"></div>
    </div>
    <button class="go-btn" id="t-play-again-btn" onclick="restartGame()">لعب من جديد</button>
    <a href="index.html" class="back-link" id="t-back-home1">رجوع للقائمة الرئيسية</a>
  </div>

</div>

<script>
let players = [];
let lang = localStorage.getItem('lang') || 'ar';
let isLight = false;

let round = 1;
const maxRounds = 3;
let timerInterval = null;
let currentBidderId = null;
let bidAmount = 0;
let categories = [];

const categoriesBank = {
  ar: [
    "ماركات سيارات", "أشياء تشتريها من البقالة", "دول تبدأ بحرف الميم",
    "تطبيقات في هاتفك", "أكلات تبدأ بحرف الكاف", "حيوانات برية",
    "أشياء تجدها في غرفة النوم", "أسماء أولاد بحرف الألف", "وظائف طبية",
    "أشياء لونها أزرق", "مدن أو عواصم عربية", "أندية كرة قدم",
    "أشياء تطير", "لغات برمجة أو برامج", "أشياء مصنوعة من الخشب"
  ],
  en: [
    "Car brands", "Things you buy at a grocery store", "Countries starting with 'M'",
    "Apps on your phone", "Foods starting with 'C'", "Wild animals",
    "Things you find in a bedroom", "Boy names starting with 'A'", "Medical jobs",
    "Things that are blue", "Arab cities or capitals", "Football clubs",
    "Things that fly", "Programming languages or software", "Things made of wood"
  ]
};

const translations = {
  ar: {
    gameTitle: "لعبة مزاد الكلمات",
    setupTitle: "إعداد المزاد",
    addLbl: "إدخال أسماء اللاعبين",
    addBtn: "إضافة",
    addedLbl: "قائمة اللاعبين",
    startGameBtn: "ابدأ المزاد الآن ←",
    backHome: "رجوع للقائمة الرئيسية",
    playTitle: "المزاد شغال!",
    roundText: "الجولة: ",
    catLbl: "الفئة الحالية",
    bidInstruction: "تزايدوا شفهياً، ثم أدخلوا اسم صاحب أعلى رقم للمزاد!",
    startBidBtn: "ابدأ التحدي (15 ثانية) ⏱️",
    failBtn: "فشل ❌",
    correctBtn: "نجح ✅",
    endTitle: "الترتيب النهائي",
    playAgain: "لعب من جديد",
    langBtn: "EN",
    nameExist: "هذا الاسم موجود مسبقاً!",
    fillAlert: "يرجى إضافة لاعبين اثنين على الأقل!",
    bidAlert: "الرجاء إدخال عدد صالح من الكلمات للمزايدة!"
  },
  en: {
    gameTitle: "The Bid",
    setupTitle: "The Bid Setup",
    addLbl: "Enter Player Names",
    addBtn: "Add",
    addedLbl: "Players List",
    startGameBtn: "Start Bid Now ←",
    backHome: "Back to Main Menu",
    playTitle: "Live Auction!",
    roundText: "Round: ",
    catLbl: "Current Category",
    bidInstruction: "Bid verbally, then pick the winner and their bid!",
    startBidBtn: "Start Challenge (15s) ⏱️",
    failBtn: "Failed ❌",
    correctBtn: "Succeeded ✅",
    endTitle: "Final Standings",
    playAgain: "Play Again",
    langBtn: "AR",
    nameExist: "This name already exists!",
    fillAlert: "Please add at least 2 players!",
    bidAlert: "Please enter a valid number for the bid!"
  }
};

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  localStorage.setItem('lang', lang);

  document.getElementById('page-title').textContent = translations[lang].gameTitle;
  document.getElementById('t-setup-title').textContent = translations[lang].setupTitle;
  document.getElementById('t-add-lbl').textContent = translations[lang].addLbl;
  document.getElementById('new-player-name').placeholder = lang === 'ar' ? "اسم اللاعب..." : "Player name...";
  document.getElementById('t-add-btn').textContent = translations[lang].addBtn;
  document.getElementById('t-added-lbl').textContent = translations[lang].addedLbl;
  document.getElementById('t-start-game-btn').textContent = translations[lang].startGameBtn;
  document.getElementById('t-back-home0').textContent = translations[lang].backHome;
  document.getElementById('t-back-home1').textContent = translations[lang].backHome;
  document.getElementById('t-play-title').textContent = translations[lang].playTitle;
  document.getElementById('t-cat-lbl').textContent = translations[lang].catLbl;
  document.getElementById('t-bid-instruction').textContent = translations[lang].bidInstruction;
  document.getElementById('t-start-bid-btn').textContent = translations[lang].startBidBtn;
  document.getElementById('t-fail-btn').textContent = translations[lang].failBtn;
  document.getElementById('t-correct-btn').textContent = translations[lang].correctBtn;
  document.getElementById('t-end-title').textContent = translations[lang].endTitle;
  document.getElementById('t-play-again-btn').textContent = translations[lang].playAgain;
  document.getElementById('lang-btn').textContent = translations[lang].langBtn;

  renderPlayersUI();
}

function toggleLang() {
  lang = lang === 'ar' ? 'en' : 'ar';
  applyLang();
}

function toggleTheme() {
  isLight = !isLight;
  document.getElementById('app').classList.toggle('light', isLight);
  document.getElementById('te0').textContent = isLight ? '☀️' : '🌙';
}

function show(id) {
  ['setup-screen','play-screen','end-screen'].forEach(s =>
    document.getElementById(s).className = 'screen' + (s === id ? ' active' : ''));
}

function addPlayer() {
  const inp = document.getElementById('new-player-name');
  const name = inp.value.trim();
  if (!name) return;
  if (players.find(p => p.name === name)) {
    alert(translations[lang].nameExist);
    return;
  }
  players.push({ id: Date.now() + Math.random(), name: name, score: 0 });
  inp.value = '';
  renderPlayersUI();
}

function removePlayer(id) {
  players = players.filter(p => p.id !== id);
  renderPlayersUI();
}

function renderPlayersUI() {
  const list = document.getElementById('players-list-ui');
  list.innerHTML = '';
  players.forEach(p => {
    const d = document.createElement('div');
    d.className = 'player-item';
    d.innerHTML = `<span>${p.name}</span> <span class="remove-btn" onclick="removePlayer(${p.id})">×</span>`;
    list.appendChild(d);
  });
}

function startGame() {
  if (players.length < 2) {
    alert(translations[lang].fillAlert);
    return;
  }
  categories = [...categoriesBank[lang]].sort(() => Math.random() - 0.5);
  round = 1;
  players.forEach(p => p.score = 0);
  setupRound();
}

function setupRound() {
  show('play-screen');
  document.getElementById('live-round').textContent = translations[lang].roundText + `${round}/${maxRounds}`;
  
  // اختيار فئة عشوائية
  if (categories.length === 0) categories = [...categoriesBank[lang]].sort(() => Math.random() - 0.5);
  document.getElementById('category-display').textContent = categories.pop();

  // تصفير شاشة الإدخال والمؤقت
  document.getElementById('sec-timer').style.display = 'none';
  document.getElementById('sec-timer').textContent = '15';
  document.getElementById('t-start-bid-btn').style.display = 'block';
  document.getElementById('after-timer-actions').style.display = 'none';
  document.getElementById('bid-amount-input').value = '';

  // تعبئة قائمة اللاعبين في الاختيار
  const sel = document.getElementById('bid-winner-select');
  sel.innerHTML = '';
  players.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name;
    sel.appendChild(opt);
  });
}

function startTimerAndChallenge() {
  const inputVal = document.getElementById('bid-amount-input').value;
  bidAmount = parseInt(inputVal);
  if (isNaN(bidAmount) || bidAmount <= 0) {
    alert(translations[lang].bidAlert);
    return;
  }

  currentBidderId = Number(document.getElementById('bid-winner-select').value);

  // إظهار وبدء العداد التنازلي
  document.getElementById('t-start-bid-btn').style.display = 'none';
  const timerEl = document.getElementById('sec-timer');
  timerEl.style.display = 'block';

  let counter = 15;
  timerEl.textContent = counter;

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    counter--;
    timerEl.textContent = counter;
    if (counter <= 0) {
      clearInterval(timerInterval);
      document.getElementById('after-timer-actions').style.display = 'flex';
    }
  }, 1000);
}

function playerActionResult(isSuccess) {
  if (isSuccess) {
    // نجح: يأخذ الشخص المزايد نقاطاً مساوية للمزايدة
    const winner = players.find(p => p.id === currentBidderId);
    if (winner) winner.score += bidAmount;
  } else {
    // فشل: يحصل بقية اللاعبين على نصف قيمة المزايدة كنقاط
    const share = Math.max(1, Math.floor(bidAmount / 2));
    players.forEach(p => {
      if (p.id !== currentBidderId) p.score += share;
    });
  }

  round++;
  if (round > maxRounds) {
    endGame();
  } else {
    setupRound();
  }
}

function endGame() {
  show('end-screen');
  const board = document.getElementById('leaderboard-list');
  board.innerHTML = '';

  // الترتيب من الأعلى نقاطاً للأقل
  const sorted = [...players].sort((a, b) => b.score - a.score);

  sorted.forEach((p, idx) => {
    const item = document.createElement('div');
    item.className = 'score-item';
    let medal = idx === 0 ? '🏆 ' : idx === 1 ? '🥈 ' : idx === 2 ? '🥉 ' : '👤 ';
    item.innerHTML = `<span>${medal} ${p.name}</span> <span>${p.score} ${lang === 'ar' ? 'نقاط' : 'Pts'}</span>`;
    board.appendChild(item);
  });
}

function restartGame() {
  show('setup-screen');
}

applyLang();
</script>
</body>
</html>
